site_name: visao-computacional
repo_url: https://github.com/RodrigoMacedo99/visao-computacional
site_url: https://RodrigoMacedo99.github.io/visao-computacional
site_description: This is a template repository for Python projects that use uv for their dependency management.
site_author: Florian Maas
edit_uri: edit/main/docs/
repo_name: RodrigoMacedo99/visao-computacional
copyright: Maintained by <a href="https://RodrigoMacedo99.com">RodrigoMacedo99</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/visao_computacional"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RodrigoMacedo99/visao-computacional
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/visao-computacional

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
